[package]
name = "integrity-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1.1.4", optional = true, features=["mm"] }
blake3 = { version = "1.5", default-features = false }
parking_lot = { version = "0.12.5" }

[features]
default = ["std"]
std = ["dep:rustix", "blake3/std"]
